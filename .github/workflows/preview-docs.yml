name: Preview Docs (PR)

# Per-PR preview for the Starlight docs site (apps/docs). Uploads a Worker
# VERSION of `quarry-docs` (no deploy, no traffic promotion) — Cloudflare serves
# it at an ephemeral, hash-prefixed preview URL (`preview_urls = true` in
# apps/docs/wrangler.toml). The URL is posted as a sticky PR comment under a
# marker DISTINCT from the web preview (`quarry-docs-preview-url`), so the two
# previews never overwrite each other on the same PR.
#
# Gated + guarded exactly like Preview Web: requires DOCS_DEPLOY_ENABLED=true
# and the CLOUDFLARE_* secrets, same-repo human-authored PRs only (fork and
# Dependabot runs get no secrets, so the upload could only fail red).
# SECURITY: never convert this workflow to `pull_request_target` — that would
# expose the Cloudflare deploy token to PR code.

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/docs/**'
      # The site is generated from docs/ at build, so preview docs/ edits too.
      - 'docs/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/preview-docs.yml'

concurrency:
  group: preview-docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  NODE_VERSION: 24
  PNPM_VERSION: 10.14.0

jobs:
  preview:
    name: Upload docs preview version
    runs-on: ubuntu-latest
    if: >-
      ${{ vars.DOCS_DEPLOY_ENABLED == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build docs site (Starlight → static)
        run: pnpm --filter @quarry/docs build

      - name: Upload Worker version (docs preview)
        id: upload
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          packageManager: pnpm
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/docs
          command: versions upload

      - name: Comment docs preview URL on the PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WRANGLER_OUTPUT: ${{ steps.upload.outputs.command-output }}
        with:
          script: |
            const out = process.env.WRANGLER_OUTPUT ?? '';
            const url = out.match(/https:\/\/\S+\.workers\.dev\S*/)?.[0];
            const marker = '<!-- quarry-docs-preview-url -->';
            const body = url
              ? `${marker}\n**Docs preview deployed** → ${url}\n\n_Ephemeral Worker version of the docs site (docs.quarry.team). Updated on every push to this PR._`
              : `${marker}\n**Docs preview upload ran, but no preview URL was found in the wrangler output.** Check the workflow logs.`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
