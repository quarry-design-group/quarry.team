name: Deploy Docs (Cloudflare Worker)

# Builds the Starlight docs site (apps/docs) and deploys it as a Cloudflare
# Worker with Static Assets on docs.quarry.team. Pure static — no D1/KV, no
# secrets, no build-time env. Cloudflare creates the custom-domain DNS record
# on deploy (so there is no Terraform record for docs.quarry.team).
#
# Gated behind DOCS_DEPLOY_ENABLED so the first go-live is a deliberate flip,
# consistent with the web deploys (ADR-0013). Requires repo secrets
# CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (the token must be allowed to
# manage the quarry-docs Worker and create its custom-domain route).

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      # The site is generated from docs/ (apps/docs/scripts/sync-docs.mjs runs at
      # build), so a change to the canonical docs must redeploy the mirror too.
      - 'docs/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

# Deploys authenticate to Cloudflare with CLOUDFLARE_API_TOKEN; the
# GITHUB_TOKEN is only used for checkout, so keep it read-only.
permissions:
  contents: read

env:
  NODE_VERSION: 24
  PNPM_VERSION: 10.14.0

jobs:
  deploy-docs:
    name: Deploy docs (docs.quarry.team)
    runs-on: ubuntu-latest
    if: ${{ vars.DOCS_DEPLOY_ENABLED == 'true' }}
    environment:
      name: docs
      url: https://docs.quarry.team
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build docs site (Starlight → static)
        run: pnpm --filter @quarry/docs build

      - name: Deploy Worker (docs)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          packageManager: pnpm
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/docs
          command: deploy
