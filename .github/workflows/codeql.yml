name: CodeQL

# CodeQL static analysis. Result upload requires code scanning to be available
# on the repo (free for public repos), so the job is gated behind the repo
# variable ENABLE_CODEQL — set it to `true` where code scanning is enabled, and
# leave it unset in clones/mirrors where the upload would fail with "Resource
# not accessible by integration". Dependency and secret scanning run
# independently in security.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1'

jobs:
  analyze:
    name: Analyze (JS/TS)
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_CODEQL == 'true' }}
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
